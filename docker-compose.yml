services:
  app:
    build:
      context: .
      dockerfile: Dockerfile.dev
    container_name: urban_tasker_app
    ports:
      - '${PORT}:3000'
    env_file:
      - .env
    depends_on:
      - mongo
      - redis
    volumes:
      - ./src:/usr/src/app/src
      - ./logs:/var/log/app

  mongo:
    image: mongo:7.0
    container_name: mongodb
    command: ['--port', '27019']
    ports:
      - '27019:27019'
    volumes:
      - mongo_data:/data/db

  redis:
    image: redis:alpine
    container_name: redis_server
    env_file:
      - .env
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 5s
      retries: 3
    command: /bin/sh -c "redis-server --requirepass $$REDIS_PASS"
    ports:
      - '6379:6379'
    volumes:
      - cache:/data

  loki:
    image: grafana/loki:2.9.4
    container_name: loki
    ports:
      - '3100:3100'
    volumes:
      - ./monitoring/loki/loki-config.yml:/etc/loki/config.yml
      - loki_data:/loki
    command: -config.file=/etc/loki/config.yml

  promtail:
    image: grafana/promtail:2.9.4
    container_name: promtail
    volumes:
      - ./monitoring/promtail/promtail-config.yml:/etc/promtail/config.yml
      - ./logs:/var/log/app
    command: -config.file=/etc/promtail/config.yml
    depends_on:
      - loki

  grafana:
    image: grafana/grafana:10.2.0
    container_name: grafana
    ports:
      - '3001:3000'
    volumes:
      - ./monitoring/grafana/datasource.yml:/etc/grafana/provisioning/datasources/datasource.yml
    depends_on:
      - loki

volumes:
  mongo_data:
    driver: local
  cache:
    driver: local
  loki_data:
    driver: local
