server:
  http_listen_port: 9080

positions:
  filename: /tmp/positions.yaml

clients:
  - url: http://loki:3100/loki/api/v1/push

scrape_configs:
  - job_name: nestjs-api
    static_configs:
      - targets:
          - 127.0.0.1
        labels:
          job: nestjs
          app: api
          __path__: /var/log/app/*.log
